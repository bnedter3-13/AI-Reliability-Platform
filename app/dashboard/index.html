<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Reliability Platform â Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --card: #131920;
    --border: #232b34;
    --text: #e6edf3;
    --muted: #8b98a5;
    --pass: #3fb950;
    --warn: #d29922;
    --fail: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: 600; }
  .card .value.pass { color: var(--pass); }
  .card .value.warn { color: var(--warn); }
  .card .value.fail { color: var(--fail); }
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .status-badge.pass { background: rgba(63,185,80,0.15); color: var(--pass); }
  .status-badge.warning { background: rgba(210,153,34,0.15); color: var(--warn); }
  .status-badge.fail { background: rgba(248,81,73,0.15); color: var(--fail); }
  .root-cause { color: var(--muted); font-size: 12px; }
  .question-cell { max-width: 260px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  button {
    background: var(--accent);
    color: #0b0f14;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .drift-banner {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .drift-banner.show { display: block; }
  .drift-banner.ok { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: var(--pass); }
  .drift-banner.alert { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: var(--fail); }
</style>
</head>
<body>

<div class="refresh-row">
  <div>
    <h1>AI Reliability Platform</h1>
    <div class="subtitle">Live monitoring dashboard â Team Nexus AI</div>
  </div>
  <button onclick="loadAll()">Refresh</button>
</div>

<div id="driftBanner" class="drift-banner"></div>

<div class="grid" id="metricsGrid">
  <div class="card"><div class="label">Total Evaluations</div><div class="value" id="mTotal">â</div></div>
  <div class="card"><div class="label">Pass Rate</div><div class="value" id="mPassRate">â</div></div>
  <div class="card"><div class="label">Avg Faithfulness</div><div class="value" id="mFaithfulness">â</div></div>
  <div class="card"><div class="label">Avg Hallucination Risk</div><div class="value" id="mHallucination">â</div></div>
  <div class="card"><div class="label">Avg Latency</div><div class="value" id="mLatency">â</div></div>
</div>

<div class="panels">
  <div class="panel">
    <h2>Score Trends</h2>
    <canvas id="scoreChart" height="220"></canvas>
  </div>
  <div class="panel">
    <h2>Root Cause Breakdown</h2>
    <canvas id="causeChart" height="220"></canvas>
  </div>
</div>

<div class="panel">
  <h2>Recent Evaluations</h2>
  <div id="evalTableWrap">
    <div class="empty">Loadingâ¦</div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

async function fetchJSON(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error(`${path} returned ${res.status}`);
  return res.json();
}

function statusClass(status) {
  if (status === 'pass') return 'pass';
  if (status === 'warning') return 'warning';
  return 'fail';
}

function fmtPct(n) {
  return (n * 100).toFixed(1) + '%';
}

let scoreChart, causeChart;

async function loadMetrics() {
  const m = await fetchJSON('/api/v1/metrics');
  document.getElementById('mTotal').textContent = m.total_requests;
  document.getElementById('mPassRate').textContent = fmtPct(m.pass_rate);
  document.getElementById('mPassRate').className = 'value ' + (m.pass_rate >= 0.7 ? 'pass' : m.pass_rate >= 0.4 ? 'warn' : 'fail');
  document.getElementById('mFaithfulness').textContent = m.avg_faithfulness.toFixed(2);
  document.getElementById('mFaithfulness').className = 'value ' + (m.avg_faithfulness >= 0.7 ? 'pass' : m.avg_faithfulness >= 0.4 ? 'warn' : 'fail');
  document.getElementById('mHallucination').textContent = m.avg_hallucination_risk.toFixed(2);
  document.getElementById('mHallucination').className = 'value ' + (m.avg_hallucination_risk <= 0.3 ? 'pass' : m.avg_hallucination_risk <= 0.6 ? 'warn' : 'fail');
  document.getElementById('mLatency').textContent = Math.round(m.avg_latency_ms) + ' ms';
  return m;
}

async function loadDrift() {
  const d = await fetchJSON('/api/v1/drift');
  const banner = document.getElementById('driftBanner');
  if (d.sample_size_previous === 0) {
    banner.className = 'drift-banner show ok';
    banner.textContent = `Not enough historical data yet to detect drift (need a previous ${d.recent_window_days}-day window).`;
  } else if (d.drift_detected) {
    banner.className = 'drift-banner show alert';
    banner.textContent = `â  Drift detected: faithfulness dropped ${(d.drop_percentage * 100).toFixed(1)}% vs the previous window.`;
  } else {
    banner.className = 'drift-banner show ok';
    banner.textContent = `No drift detected. Recent avg faithfulness: ${d.recent_avg_faithfulness.toFixed(2)} (previous: ${d.previous_avg_faithfulness.toFixed(2)}).`;
  }
}

async function loadEvaluations() {
  const rows = await fetchJSON('/api/v1/evaluations?limit=20');
  const wrap = document.getElementById('evalTableWrap');

  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">No evaluations yet â send a request to /api/v1/health-checks to see it here.</div>';
    renderCharts([]);
    return;
  }

  let html = '<table><thead><tr><th>Question</th><th>Status</th><th>Faithfulness</th><th>Hallucination Risk</th><th>Root Cause</th><th>Time</th></tr></thead><tbody>';
  for (const r of rows) {
    const time = r.created_at ? new Date(r.created_at).toLocaleString() : 'â';
    html += `<tr>
      <td class="question-cell">${escapeHtml(r.question)}</td>
      <td><span class="status-badge ${statusClass(r.status)}">${r.status}</span></td>
      <td>${r.faithfulness_score.toFixed(2)}</td>
      <td>${r.hallucination_risk.toFixed(2)}</td>
      <td class="root-cause">${r.root_cause || 'â'}</td>
      <td class="root-cause">${time}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  renderCharts(rows);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderCharts(rows) {
  const ordered = [...rows].reverse(); // oldest -> newest
  const labels = ordered.map((_, i) => `#${i + 1}`);
  const faithfulness = ordered.map(r => r.faithfulness_score);
  const hallucination = ordered.map(r => r.hallucination_risk);

  if (scoreChart) scoreChart.destroy();
  scoreChart = new Chart(document.getElementById('scoreChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Faithfulness', data: faithfulness, borderColor: '#3fb950', tension: 0.3 },
        { label: 'Hallucination Risk', data: hallucination, borderColor: '#f85149', tension: 0.3 },
      ]
    },
    options: {
      responsive: true,
      scales: { y: { min: 0, max: 1, ticks: { color: '#8b98a5' } }, x: { ticks: { color: '#8b98a5' } } },
      plugins: { legend: { labels: { color: '#e6edf3' } } }
    }
  });

  const causeCounts = {};
  for (const r of rows) {
    const c = r.root_cause || 'none';
    causeCounts[c] = (causeCounts[c] || 0) + 1;
  }
  const causeLabels = Object.keys(causeCounts);
  const causeValues = Object.values(causeCounts);
  const colors = { none: '#3fb950', hallucination: '#f85149', no_context: '#d29922', poor_retrieval: '#f0883e', unfaithful_answer: '#a371f7', low_correctness: '#58a6ff', unknown: '#8b98a5' };

  if (causeChart) causeChart.destroy();
  causeChart = new Chart(document.getElementById('causeChart'), {
    type: 'doughnut',
    data: {
      labels: causeLabels,
      datasets: [{ data: causeValues, backgroundColor: causeLabels.map(l => colors[l] || '#8b98a5') }]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { color: '#e6edf3' } } }
    }
  });
}

async function loadAll() {
  try {
    await loadMetrics();
    await loadDrift();
    await loadEvaluations();
  } catch (err) {
    console.error(err);
    document.getElementById('evalTableWrap').innerHTML =
      `<div class="empty">Could not load data: ${err.message}. Is the API running?</div>`;
  }
}

loadAll();
setInterval(loadAll, 15000); // auto-refresh every 15s
</script>

</body>
</html>
